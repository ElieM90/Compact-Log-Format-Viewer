<div class="modal" tabindex="-1" ng-show="show" style="display: block; background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Select FTP Connection</h5>
        <button type="button" class="btn-close" ng-click="cancel()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- Loading Indicator -->
        <div ng-show="loading" class="text-center py-4">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <!-- Saved Connections List -->
        <div ng-hide="loading">
          <div ng-show="savedConnections.length === 0" class="text-center text-muted py-4">
            <p>No saved FTP connections found.</p>
            <p>Click "New Connection" to create one.</p>
          </div>

          <div ng-show="savedConnections.length > 0" style="max-height: 400px; overflow-y: auto;">
            <div class="list-group">
              <div ng-repeat="connection in savedConnections"
                   ng-click="selectConnection(connection)"
                   ng-class="{'active': selectedConnection === connection}"
                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-start"
                   style="cursor: pointer;">
                <div class="flex-grow-1">
                  <div class="d-flex w-100 justify-content-between">
                    <h6 class="mb-1">{{ connection.name }}</h6>
                  </div>
                  <p class="mb-1 text-muted small">{{ connection.username }}@{{ connection.host }}:{{ connection.port }}</p>
                  <small class="text-muted" ng-show="connection.lastRemotePath">Last path: {{ connection.lastRemotePath }}</small>
                </div>
                <button type="button" class="btn btn-sm btn-outline-danger ms-2" ng-click="deleteConnection(connection, $event)" title="Delete connection">
                  &times;
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" ng-click="createNewConnection()">New Connection</button>
        <button type="button" class="btn btn-secondary" ng-click="cancel()">Cancel</button>
        <button type="button" class="btn btn-primary" ng-click="connectToSelected()" ng-disabled="!selectedConnection">
          Connect
        </button>
      </div>
    </div>
  </div>
</div>
